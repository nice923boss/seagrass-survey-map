<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <pattern id="grid-fine" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#cdd9df" stroke-width="1" />
    </pattern>
    <pattern id="grid-bold" width="400" height="400" patternUnits="userSpaceOnUse">
      <path d="M 400 0 L 0 0 0 400" fill="none" stroke="#a7bcc6" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="2400" height="1600" fill="#eef3f5" />
  <rect width="2400" height="1600" fill="url(#grid-fine)" />
  <rect width="2400" height="1600" fill="url(#grid-bold)" />
  <rect x="1" y="1" width="2398" height="1598" fill="none" stroke="#5c6b73" stroke-width="3" />

  <!-- 中央提示 -->
  <text x="1200" y="760" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="90" font-weight="700" fill="#2e4a55">示意底圖 Placeholder</text>
  <text x="1200" y="850" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="46" fill="#5c6b73">2400 × 1600 像素</text>
  <text x="1200" y="915" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="40" fill="#5c6b73">請於管理者模式上傳實際底圖後替換</text>

  <!-- 四角座標（左上為原點） -->
  <text x="24" y="52" font-family="monospace" font-size="34" fill="#7a8c94">(0, 0)</text>
  <text x="2376" y="52" text-anchor="end" font-family="monospace" font-size="34" fill="#7a8c94">(2400, 0)</text>
  <text x="24" y="1576" font-family="monospace" font-size="34" fill="#7a8c94">(0, 1600)</text>
  <text x="2376" y="1576" text-anchor="end" font-family="monospace" font-size="34" fill="#7a8c94">(2400, 1600)</text>
</svg>
