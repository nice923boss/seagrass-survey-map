name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # base 自動取用 repo 名稱（<user>.github.io/<repo>/）。
      # 若使用自訂網域，改設 VITE_BASE 為 /。
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 專員點位編輯頁「儲存到網站」所需：fine-grained PAT（僅此 repo、Contents: Read and write）。
          # 未設定此 secret 時編輯頁仍可用，但只能匯出 markers.json 檔案。
          VITE_EDITOR_GITHUB_TOKEN: ${{ secrets.EDITOR_GITHUB_TOKEN }}
          VITE_EDITOR_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
