name: Sync survey data

on:
  schedule:
    # 每日 02:00 台灣時間（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 提交後手動觸發 deploy workflow（見下方說明）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 抓取並正規化資料。資料驗證失敗時此步驟會失敗（回傳非零），workflow 中止。
      # DATA_SOURCE 預設 csvPublic（零憑證，適用公開試算表）。
      # 若試算表改為私有，於 repo variables 設 DATA_SOURCE=sheetsApi，
      # 並於 secrets 設 GOOGLE_SERVICE_ACCOUNT_JSON。
      - run: npm run fetch:data
        env:
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'csvPublic' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_TAB_NAME: ${{ vars.SHEET_TAB_NAME }}

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain public/data/surveys.json public/assets/photos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/surveys.json public/assets/photos
            git commit -m "chore: 自動更新 surveys.json 與照片"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "資料無變更，略過提交。"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # 重要：用 GITHUB_TOKEN 推送的 commit 不會觸發其他 workflow 的 push 事件
      # （GitHub 防止遞迴的設計），因此 deploy.yml 不會自動跑、網站資料停在舊版。
      # workflow_dispatch 是此規則的例外，這裡在有變更時明確觸發部署。
      - name: Trigger deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
